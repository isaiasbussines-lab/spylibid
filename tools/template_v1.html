<title>Spy Libid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: briefing de inteligência em coluna única, lido no celular de manhã; placar no topo, detalhe depois */
:root {
  --bg: #F5F4F7; --card: #FFFFFF; --fg: #1C1724; --muted: #6A6377; --line: #E3DFEA;
  --accent: #8C2C5E; --accent-soft: #F3E4EC; --amber: #B4621A; --amber-soft: #F8EBDD;
  --good: #2B7A57; --good-soft: #E1F1E8; --warn: #9A6A12; --warn-soft: #F7EED8; --crit: #B0343F; --crit-soft: #F7E1E3;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15121B; --card: #1D1925; --fg: #EDE9F3; --muted: #A49CB2; --line: #2D2738;
  --accent: #E486B6; --accent-soft: #3A2030; --amber: #EFA463; --amber-soft: #3A2A1C;
  --good: #6CCB9C; --good-soft: #1B3328; --warn: #E2B85C; --warn-soft: #362C17; --crit: #F08690; --crit-soft: #3B1E22; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15121B; --card: #1D1925; --fg: #EDE9F3; --muted: #A49CB2; --line: #2D2738;
  --accent: #E486B6; --accent-soft: #3A2030; --amber: #EFA463; --amber-soft: #3A2A1C;
  --good: #6CCB9C; --good-soft: #1B3328; --warn: #E2B85C; --warn-soft: #362C17; --crit: #F08690; --crit-soft: #3B1E22; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 34px; }
header { display: grid; gap: 10px; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(28px, 6vw, 40px)/1.05 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 700 22px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
h3 { font: 600 16px/1.3 var(--f-body); margin: 0; }
.lede { font-size: 17px; color: var(--fg); max-width: 65ch; margin: 0; }
.meta { font: 400 12px/1.4 var(--f-mono); color: var(--muted); }
.muted { color: var(--muted); }
section { display: grid; gap: 14px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--fg); padding-bottom: 8px; }
.sec-head .meta { white-space: nowrap; }
.brief { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.brief ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.brief li::marker { font: 600 13px var(--f-mono); color: var(--accent); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 680px; font-size: 14px; }
th { text-align: left; font: 500 11px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num { font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
th.num { text-align: right; }
td .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.pill { display: inline-block; font: 600 11px/1 var(--f-body); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.st-up { background: var(--good-soft); color: var(--good); }
.st-test { background: var(--warn-soft); color: var(--warn); }
.st-flat { background: var(--line); color: var(--muted); }
.st-down { background: var(--crit-soft); color: var(--crit); }
.st-new { background: var(--amber-soft); color: var(--amber); }
.d-up { color: var(--good); font-weight: 600; }
.d-down { color: var(--crit); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.block { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.block h3 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.who { font: 400 12px/1.4 var(--f-mono); color: var(--muted); }
.list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.quote { font-size: 14px; border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; color: var(--fg); margin: 0; }
.quote .src { display: block; font: 400 11px var(--f-mono); color: var(--muted); margin-top: 4px; }
.mov { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.mov-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mov-head h3 { font: 700 18px/1.2 var(--f-display); }
.kv { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 12px var(--f-mono); color: var(--muted); }
.kv b { color: var(--fg); font-weight: 500; }
.script { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; min-width: 0; }
.script-top { padding: 16px 18px 12px; display: grid; gap: 8px; border-bottom: 1px dashed var(--line); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.alt { background: var(--amber-soft); color: var(--amber); }
.hook { font: 700 19px/1.3 var(--f-display); margin: 0; text-wrap: balance; }
.hook::before { content: "HOOK  "; font: 500 11px var(--f-mono); letter-spacing: .08em; color: var(--accent); vertical-align: 3px; }
.beats { margin: 0; padding: 12px 18px 12px 38px; display: grid; gap: 7px; font-size: 14px; }
.beats li::marker { font: 500 12px var(--f-mono); color: var(--muted); }
.script-foot { padding: 10px 18px 14px; font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.script-foot b { color: var(--fg); font-weight: 600; }
.alert { background: var(--crit-soft); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
.alert ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.trend { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 70ch; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 480px) { .wrap { gap: 28px; } .hook { font-size: 17px; } }
.st-head { margin: 0; font: 700 17px/1.3 var(--f-display); }
.val { border-top: 3px solid var(--good); }
.ev { margin: 0; font-size: 13px; color: var(--muted); }
.ev b, .use b { color: var(--fg); font-weight: 600; }
.use { margin: 0; font-size: 14px; background: var(--good-soft); border-radius: 8px; padding: 8px 10px; }

</style>
<div class="wrap" id="app"><p class="meta">Carregando relatório…</p></div>
<script type="application/json" id="radar-data">__RADAR_DATA__</script>
<script>
(function () {
  var D = {};
  try { D = JSON.parse(document.getElementById('radar-data').textContent); } catch (err) {
    document.getElementById('app').innerHTML = '<p>Não consegui ler os dados deste relatório.</p>'; return;
  }
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var ST = { escalando: ['Escalando', 'st-up'], testando: ['Testando', 'st-test'], estavel: ['Estável', 'st-flat'], parado: ['Parado', 'st-down'], novo: ['Novo no radar', 'st-new'], caindo: ['Caindo', 'st-down'] };
  function pill(s) { var k = (s || '').toLowerCase(); var v = ST[k] || [s || '—', 'st-flat']; return '<span class="pill ' + v[1] + '">' + e(v[0]) + '</span>'; }
  function delta(v) {
    if (v === null || v === undefined || v === '') return '<span class="muted">—</span>';
    var n = parseInt(v, 10); if (isNaN(n)) return e(v);
    if (n > 0) return '<span class="d-up">+' + n + '</span>';
    if (n < 0) return '<span class="d-down">' + n + '</span>';
    return '<span class="muted">0</span>';
  }
  function ul(items, cls) { if (!items || !items.length) return ''; return '<ul class="' + (cls == null ? 'list' : cls) + '">' + items.map(function (i) { return '<li>' + e(i) + '</li>'; }).join('') + '</ul>'; }
  function head(t, meta) { return '<div class="sec-head"><h2>' + t + '</h2>' + (meta ? '<span class="meta">' + e(meta) + '</span>' : '') + '</div>'; }
  var o = [];
  o.push('<header><div class="eyebrow">Spy Libid · espionagem diária dos concorrentes do LibidLizze · ' + e(D.data) + '</div><h1>' + e(D.titulo || 'Relatório diário') + '</h1>' +
    '<p class="lede">' + e(D.linha_fina) + '</p><div class="meta">Gerado ' + e(D.gerado_em) + ' · Fonte: Biblioteca de Anúncios da Meta (Brasil, anúncios ativos) · Movimentos: últimas 48h</div></header>');
  if (D.resumo && D.resumo.length) o.push('<section>' + head('Resumo em 30 segundos') + '<div class="brief"><ol>' + D.resumo.map(function (x) { return '<li>' + e(x) + '</li>'; }).join('') + '</ol></div></section>');
  if (D.placar && D.placar.length) {
    o.push('<section>' + head('Placar dos concorrentes', 'ativos ≈ contagem da Biblioteca') + '<div class="table-wrap"><table><thead><tr><th>Concorrente</th><th>Status</th><th class="num">Ativos</th><th class="num">Δ ativos</th><th class="num">Novos 48h</th><th>Funil</th><th>Formato dominante</th></tr></thead><tbody>' +
      D.placar.map(function (c) {
        return '<tr><td><b>' + e(c.nome) + '</b><span class="sub">' + e(c.produto) + '</span></td><td>' + pill(c.status) + '</td><td class="num">' + e(c.ativos == null ? '—' : c.ativos) + '</td><td class="num">' + delta(c.delta_ativos) +
          '</td><td class="num">' + e(c.novos48h == null ? '—' : c.novos48h) + '</td><td>' + e(c.funil) + '</td><td>' + e(c.formato) + '</td></tr>';
      }).join('') + '</tbody></table></div></section>');
  }
  if (D.validados && D.validados.length) o.push('<section>' + head('O que já está validado', 'quem escala e o que não sai do ar') + '<div class="grid2">' + D.validados.map(function (v) {
    var tags = [v.tipo, v.formato].filter(Boolean).map(function (t) { return '<span class="tag">' + e(t) + '</span>'; }).join('');
    return '<article class="block val"><h3>' + e(v.titulo) + ' <span class="who">' + e(v.quem) + '</span></h3><div class="tags">' + tags + '</div>' +
      '<p style="margin:0">' + e(v.oque) + '</p><p class="ev"><b>Prova:</b> ' + e(v.evidencia) + '</p><p class="use"><b>Como usar no LibidLizze:</b> ' + e(v.como_usar) + '</p></article>';
  }).join('') + '</div></section>');
  var P = D.panorama || {};
  if (P.texto || P.mecanismos) {
    var blocks = [['mecanismos', 'Mecanismos em uso'], ['angulos', 'Ângulos que estão rodando'], ['formatos', 'Formatos de criativo'], ['funis_ofertas', 'Funil e oferta']].map(function (k) {
      var items = P[k[0]] || []; if (!items.length) return '';
      return '<div class="block"><h3>' + k[1] + '</h3><ul class="list">' + items.map(function (it) { return '<li><b>' + e(it.nome) + '</b> — ' + e(it.desc) + '<span class="who"> · ' + e(it.quem) + '</span></li>'; }).join('') + '</ul></div>';
    }).join('');
    o.push('<section>' + head('Panorama do mercado') + (P.texto ? '<p class="lede" style="font-size:15px">' + e(P.texto) + '</p>' : '') + '<div class="grid2">' + blocks + '</div></section>');
  }
  if (D.tendencias && D.tendencias.length) o.push('<section>' + head('Tendências da memória', D.dias_memoria) + '<div class="trend">' + ul(D.tendencias) + '</div></section>');
  if (D.movimentos && D.movimentos.length) {
    o.push('<section>' + head('Movimentos das últimas 48h', 'por concorrente') + '<div class="grid2">' + D.movimentos.map(function (m) {
      var kv = Object.keys(m.numeros || {}).map(function (k) { return '<span>' + e(k) + ': <b>' + e(m.numeros[k]) + '</b></span>'; }).join('');
      var ex = (m.exemplos || []).slice(0, 2).map(function (q) { return '<p class="quote">' + e(q.texto) + '<span class="src">' + e(q.fonte) + '</span></p>'; }).join('');
      return '<article class="mov"><div class="mov-head"><h3>' + e(m.nome) + '</h3>' + pill(m.status) + '</div>' + (kv ? '<div class="kv">' + kv + '</div>' : '') + ul(m.itens) + ex + '</article>';
    }).join('') + '</div></section>');
  }
  if (D.novos_players && D.novos_players.length) o.push('<section>' + head('Novos no radar', 'entram na vigilância a partir de amanhã') + '<div class="grid2">' + D.novos_players.map(function (n) {
    return '<div class="block"><h3>' + e(n.nome) + ' <span class="who">' + e(n.produto) + '</span></h3><p style="margin:0">' + e(n.obs) + '</p></div>'; }).join('') + '</div></section>');
  if (D.sugestoes && D.sugestoes.length) o.push('<section>' + head('Criativos pra subir', 'roteiros prontos pra LibidLizze') + '<div class="grid2">' + D.sugestoes.map(function (s) {
    var tags = [s.formato, s.angulo].filter(Boolean).map(function (t) { return '<span class="tag">' + e(t) + '</span>'; }).join('') + (s.mecanismo ? '<span class="tag alt">' + e(s.mecanismo) + '</span>' : '');
    return '<article class="script"><div class="script-top"><h3>' + e(s.titulo) + '</h3><div class="tags">' + tags + '</div><p class="hook">' + e(s.hook) + '</p></div><ol class="beats">' +
      (s.roteiro || []).map(function (b) { return '<li>' + e(b) + '</li>'; }).join('') + '</ol><div class="script-foot"><span><b>CTA:</b> ' + e(s.cta) + '</span><span><b>Por que agora:</b> ' + e(s.porque) + '</span></div></article>';
  }).join('') + '</div></section>');
  if (D.estaticos && D.estaticos.length) o.push('<section>' + head('Estáticos rápidos') + '<div class="grid2">' + D.estaticos.map(function (s) {
    return '<div class="block"><h3>' + e(s.titulo) + '</h3><p class="st-head">' + e(s.headline) + '</p><p style="margin:0">' + e(s.texto) + '</p><p class="who" style="margin:0">Visual: ' + e(s.visual) + '</p></div>'; }).join('') + '</div></section>');
  if (D.alertas && D.alertas.length) o.push('<section>' + head('Alertas') + '<div class="alert">' + ul(D.alertas, '') + '</div></section>');
  if (D.arquivo && D.arquivo.length) o.push('<section>' + head('Relatórios anteriores') + '<div class="trend"><ul class="list">' + D.arquivo.slice(0, 30).map(function (a) {
    return '<li>' + (a.href ? '<a href="' + e(a.href) + '">' + e(a.data) + '</a>' : e(a.data)) + (a.resumo ? ' — ' + e(a.resumo) : '') + '</li>'; }).join('') + '</ul></div></section>');
  o.push('<footer>' + e(D.metodologia) + '</footer>');
  document.getElementById('app').innerHTML = o.join('');
  if (D.data) document.title = 'Spy Libid · ' + D.data;
})();
</script>
