<title>Spy Libid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Spy Libid v2: só o que vira criativo hoje. Coluna única, lida no celular de manhã. */
:root {
  --bg: #F5F4F7; --card: #FFFFFF; --fg: #1C1724; --muted: #6A6377; --line: #E3DFEA;
  --accent: #8C2C5E; --accent-soft: #F3E4EC; --good: #2B7A57; --good-soft: #E1F1E8; --warn-soft: #F7EED8; --warn: #8A5D0E;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15121B; --card: #1D1925; --fg: #EDE9F3; --muted: #A49CB2; --line: #2D2738;
  --accent: #E486B6; --accent-soft: #3A2030; --good: #6CCB9C; --good-soft: #1B3328; --warn-soft: #362C17; --warn: #E2B85C; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15121B; --card: #1D1925; --fg: #EDE9F3; --muted: #A49CB2; --line: #2D2738;
  --accent: #E486B6; --accent-soft: #3A2030; --good: #6CCB9C; --good-soft: #1B3328; --warn-soft: #362C17; --warn: #E2B85C; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 26px; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(24px, 6.4vw, 34px)/1.12 var(--f-display); margin: 8px 0 0; text-wrap: balance; }
h2 { font: 700 20px/1.2 var(--f-display); margin: 0; }
h3 { font: 700 19px/1.25 var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.padrao { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; font-size: 16px; }
.padrao b { color: var(--accent); }
section { display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; }
.card-top { padding: 16px 16px 12px; display: grid; gap: 8px; }
.num { font: 500 12px/1.4 var(--f-mono); color: var(--muted); }
.badge { display: inline-block; font: 600 11px/1 var(--f-body); padding: 4px 7px; border-radius: 999px; background: var(--good-soft); color: var(--good); vertical-align: 2px; margin-left: 6px; }
.badge.rep { background: var(--warn-soft); color: var(--warn); }
.btn { display: block; text-align: center; font: 600 15px/1 var(--f-body); padding: 13px 14px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; }
:root[data-theme="dark"] .btn { color: #15121B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #15121B; } }
.why { font-size: 15px; }
.btn.painel { background: var(--fg); color: var(--bg); }
.orig, .nossa { padding: 12px 16px 14px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.lbl { font: 500 11px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.nossa { background: var(--good-soft); }
.nossa .lbl { color: var(--good); }
.hook { font: 700 18px/1.3 var(--f-display); }
.hook::before { content: "“"; } .hook::after { content: "”"; }
ol, ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }
.cta { font-size: 14px; }
.cuidado { font-size: 13px; color: var(--muted); }
.mudou ul { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 34px; }
details { font-size: 14px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; }
details ul { margin-top: 8px; font-size: 14px; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { font-size: 12px; color: var(--muted); }
</style>
<div class="wrap" id="app"><p class="muted">Carregando…</p></div>
<script type="application/json" id="radar-data">__RADAR_DATA__</script>
<script>
(function () {
  var D = {};
  try { D = JSON.parse(document.getElementById('radar-data').textContent); } catch (err) {
    document.getElementById('app').innerHTML = '<p>Não consegui ler os dados deste relatório.</p>'; return;
  }
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function list(tag, items) { return items && items.length ? '<' + tag + '>' + items.map(function (i) { return '<li>' + e(i) + '</li>'; }).join('') + '</' + tag + '>' : ''; }
  var o = [];
  o.push('<header><div class="eyebrow">Spy Libid · ' + e(D.data) + '</div><h1>' + e(D.manchete || '') + '</h1></header>');
  o.push('<a class="btn painel" href="https://claude.ai/artifact/XzUinAysMH9S3HyZqo13P8" target="_blank" rel="noopener">Abrir o painel: Garimpo, Vitrine e Modelar →</a>');
  if (D.padrao) o.push('<p class="padrao"><b>Padrão do dia:</b> ' + e(D.padrao) + '</p>');
  if (D.modelar && D.modelar.length) {
    o.push('<section><h2>' + D.modelar.length + ' criativos escalados pra modelar hoje</h2>' + D.modelar.map(function (c, i) {
      var badge = c.repetido ? '<span class="badge rep">' + e(c.repetido) + '</span>' : (c.novo ? '<span class="badge">novo aqui</span>' : '');
      var O = c.original || {}, N = c.nossa_versao || {};
      return '<article class="card"><div class="card-top">' +
        '<div class="num">' + (i + 1) + ' · ' + e(c.marca) + (c.pagina ? ' · ' + e(c.pagina) : '') + '</div>' +
        '<h3>' + e(c.titulo) + badge + '</h3>' +
        '<div class="num">' + e(c.formato) + (c.numeros ? ' · ' + e(c.numeros) : '') + '</div>' +
        (c.por_que ? '<p class="why">' + e(c.por_que) + '</p>' : '') +
        (c.link ? '<a class="btn" href="' + e(c.link) + '" target="_blank" rel="noopener">Ver na Biblioteca da Meta</a>' : '') +
        '</div>' +
        '<div class="orig"><span class="lbl">Como o deles funciona</span>' + (O.hook ? '<p class="hook">' + e(O.hook) + '</p>' : '') + list('ol', O.estrutura) + '</div>' +
        '<div class="nossa"><span class="lbl">Nossa versão' + (N.persona ? ' · ' + e(N.persona) : '') + '</span>' + (N.hook ? '<p class="hook">' + e(N.hook) + '</p>' : '') + list('ol', N.roteiro) +
        (N.cta ? '<p class="cta"><b>CTA:</b> ' + e(N.cta) + '</p>' : '') + (c.cuidado ? '<p class="cuidado">Não copiar: ' + e(c.cuidado) + '</p>' : '') + '</div></article>';
    }).join('') + '</section>');
  }
  if (D.mudou && D.mudou.length) o.push('<section class="mudou"><h2>Mudou nas últimas 24h</h2>' + list('ul', D.mudou.slice(0, 3)) + '</section>');
  if (D.arquivo && D.arquivo.length) o.push('<details><summary>Relatórios anteriores</summary><ul>' + D.arquivo.slice(0, 30).map(function (a) {
    return '<li>' + (a.href ? '<a href="' + e(a.href) + '">' + e(a.data) + '</a>' : e(a.data)) + (a.resumo ? ' — ' + e(a.resumo) : '') + '</li>'; }).join('') + '</ul></details>');
  if (D.rodape) o.push('<footer>' + e(D.rodape) + '</footer>');
  document.getElementById('app').innerHTML = o.join('');
  if (D.data) document.title = 'Spy Libid · ' + D.data;
})();
</script>
